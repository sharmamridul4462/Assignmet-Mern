<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        * {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .card {
            background-color: lightyellow;
            padding: 20px;
        }

        #hero {
            color: red;
            text-align: center;
        }
    </style>

</head>
<body>

    <h1>Element Selector</h1>

    <div class="card">
        This is Class Selector.
    </div>

    <h2 id="hero">This is ID Selector</h2>

</body>
</html>
