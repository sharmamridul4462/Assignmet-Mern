<!DOCTYPE html>
<html>
<head>
    <title>Grid Template Areas</title>

    <style>
        .container {
            display: grid;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";

            grid-template-columns: 1fr 3fr;
            gap: 10px;
        }

        .head {
            grid-area: head;
            background-color: lightblue;
            padding: 20px;
        }

        .side {
            grid-area: side;
            background-color: lightgreen;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: lightyellow;
            padding: 20px;
        }

        .foot {
            grid-area: foot;
            background-color: lightpink;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Grid Areas</h1>

    <div class="container">

        <header class="head">
            Header
        </header>

        <aside class="side">
            Sidebar
        </aside>

        <main class="main">
            Main Content
        </main>

        <footer class="foot">
            Footer
        </footer>

    </div>

</body>
</html>
