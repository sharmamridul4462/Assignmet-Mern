<!DOCTYPE html>
<html>
<head>
    <title>Responsive Website</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: navy;
            padding: 15px;
            color: white;
        }

        .links a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            flex: 1 1 200px;
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
            }

            .links a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">

        <h2>My Website</h2>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <h1 style="text-align:center;">Responsive Cards</h1>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn HTML</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn CSS</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Learn JavaScript</p>
        </div>

    </div>

</body>
</html>
