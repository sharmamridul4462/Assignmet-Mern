<!DOCTYPE html>
<html>
<head>
    <title>Flex Navbar</title>

    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: navy;
            padding: 15px;
        }

        .logo {
            color: white;
            font-size: 25px;
        }

        .links a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        button {
            background-color: orange;
            padding: 10px;
            border: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">

        <h2 class="logo">My Website</h2>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <button>Login</button>
        </div>

    </nav>

</body>
</html>
