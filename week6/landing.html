<!DOCTYPE html>
<html>
<head>
    <title>Landing Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: navy;
            padding: 15px;
        }

        .logo {
            color: white;
        }

        .links a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .banner {
            height: 400px;
            background-color: lightblue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background-color: orange;
            border: none;
        }
    </style>
</head>
<body>

    <nav class="navbar">

        <h2 class="logo">My Website</h2>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <div class="banner">

        <h1>Welcome to My Website</h1>

        <p>Learn Web Development</p>

        <button>Get Started</button>

    </div>

</body>
</html>
