<!DOCTYPE html>
<html>
<head>
    <title>Flex Cards</title>

    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            flex: 1 1 200px;
            background-color: lightblue;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>My Cards</h1>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn HTML</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn CSS</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Learn JavaScript</p>
        </div>

    </div>

</body>
</html>
