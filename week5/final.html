<!DOCTYPE html>
<html>
<head>
    <title>My Final Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background-color: lightgray;
            margin: 0;
        }

        .header {
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .profile-card {
            background-color: white;
            width: 300px;
            padding: 20px;
            margin: 50px auto;
            border: 2px solid black;
            border-radius: 15px;
            text-align: center;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background-color: skyblue;
            border-radius: 50%;
            margin: auto;
        }

        .profile-button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>My Profile</h1>
    </header>

    <div class="profile-card">
        <div class="profile-avatar"></div>

        <h2>Mridul Sharma</h2>

        <p>BTech CSE Student</p>

        <button class="profile-button">
            Contact Me
        </button>
    </div>

</body>
</html>
