<!DOCTYPE html>
<html>
<head>
    <title>Sticky and Fixed</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .topbar {
            background-color: blue;
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .content {
            padding: 20px;
            height: 1000px;
        }

        .add-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: green;
            color: white;
            padding: 15px 20px;
            border-radius: 50%;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <h2>My Website</h2>
    </div>

    <div class="content">
        <h1>Welcome</h1>
        <p>Scroll down to test sticky bar.</p>
        <p>This is my website content.</p>
    </div>

    <button class="add-btn">+</button>

</body>
</html>
