<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .box {
            width: 300px;
            padding: 20px;
            border: 5px solid blue;
            margin: 30px;
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        This is my Box Model.
    </div>

</body>
</html>
