<!DOCTYPE html>
<html>
<head>
    <title>Profile Cards</title>

    <style>
        .card {
            width: 250px;
            padding: 20px;
            margin: 20px;
            border: 2px solid black;
            border-radius: 15px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: lightblue;
            margin: auto;
        }

        .card1 {
            background-color: lightblue;
        }

        .card2 {
            background-color: lightpink;
        }
    </style>
</head>
<body>

    <h1>My Profile Cards</h1>

    <div class="card card1">
        <div class="avatar"></div>
        <h2>Mridul Sharma</h2>
        <p>BTech CSE Student</p>
    </div>

    <div class="card card2">
        <div class="avatar"></div>
        <h2>Mridul Sharma</h2>
        <p>Web Developer</p>
    </div>

</body>
</html>
