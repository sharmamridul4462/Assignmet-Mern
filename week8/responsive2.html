<!DOCTYPE html>
<html>
<head>
    <title>Responsive Images</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            font-size: 1rem;
        }

        h1 {
            font-size: 2rem;
        }

        p {
            font-size: 1.2rem;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h1>Responsive Image</h1>

    <img src="photo.jpg"
    alt="Nature Image">

    <p>This image adjusts according to screen size.</p>

</body>
</html>
