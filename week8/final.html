<!DOCTYPE html>
<html>
<head>
    <title>Final Responsive Project</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightgray;
        }

        /* Mobile First Navbar */
        .navbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: navy;
            color: white;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 8px;
        }

        /* Mobile Grid */
        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 15px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        h1 {
            font-size: 1.5rem;
        }

        /* Tablet */
        @media (min-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
            }

            .container {
                grid-template-columns: repeat(2, 1fr);
                padding: 25px;
            }

            h1 {
                font-size: 2rem;
            }
        }

        /* Desktop */
        @media (min-width: 1024px) {
            .container {
                grid-template-columns: repeat(3, 1fr);
                padding: 40px;
            }

            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">

        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <h1 style="text-align:center;">
        My Responsive Website
    </h1>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn HTML</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn CSS</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Learn JavaScript</p>
        </div>

    </div>

</body>
</html>
