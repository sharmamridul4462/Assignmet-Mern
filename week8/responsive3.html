<!DOCTYPE html>
<html>
<head>
    <title>Grid and Flexbox</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: navy;
            color: white;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 5px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 20px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <div class="container">

        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>
        <div class="box">Java</div>

    </div>

</body>
</html>
